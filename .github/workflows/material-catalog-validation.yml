name: Material catalog validation

on:
  push:
    branches:
      - feature/material-catalog-create
      - feature/work-price-editor
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Changed-file lint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: baget-vue-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: baget-vue-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint on changed files
        run: npx eslint src/components/MaterialsDesk.vue src/components/SettingsDesk.vue src/components/WorkPricesDesk.vue src/services/workPrices.js
      - name: Build for production
        run: npm run build
