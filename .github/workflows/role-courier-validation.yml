name: Frontend validation

on:
  push:
    branches:
      - feature/role-courier-assortment
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Changed-file lint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: baget-vue-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: baget-vue-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint on changed files
        run: npx eslint src/App.vue src/components/FrameSamplesDesk.vue src/components/UserAdministration.vue src/components/EstimateCalculator.vue src/services/auth.js
      - name: Build for production
        run: npm run build
